const gdiff=()=>{const p=rp(3),q=rp(3);return{t:PW(p)+' − '+PW(q),a:add(p,neg(q)),h:'Cambia il segno di TUTTI i termini della seconda parentesi, poi riduci.'}};
const gbb=()=>{const p=lin(),q=lin();return{t:PW(p)+PW(q),a:mul(p,q),h:'Moltiplica ogni termine della prima parentesi per ogni termine della seconda, poi riduci.'}};
const gsq=()=>{const p=lin();return{t:PW(p)+'²',a:mul(p,p),h:'(A ± B)² = A² ± 2AB + B². Non dimenticare il doppio prodotto!'}};
const gsd=()=>{const a=1+r(3),b=1+r(6),p=norm([T(a,1,0),T(b,0,0)]),q=norm([T(a,1,0),T(-b,0,0)]);return{t:PW(p)+PW(q),a:mul(p,q),h:'Somma per differenza: (A + B)(A − B) = A² − B².'}};
const gbt=()=>{const p=lin(),q=rp(3,4);return{t:PW(p)+PW(q),a:mul(p,q),h:'Distribuisci ogni termine del binomio sul trinomio, poi riduci i termini simili.'}};
const gmix=()=>{const p=lin(),q=lin(),s=lin();return{t:PW(p)+'² − '+PW(q)+PW(s),a:add(mul(p,p),neg(mul(q,s))),h:'Sviluppa prima il quadrato e il prodotto, poi cambia segno al prodotto e riduci.'}};
const G=[0,[g1a,g1b,g1c],[gpow,gmp],[gsum,gdiff],[gbb,gsq],[gsd,gbt,gmix]];

/* ---------- game ---------- */
const cx=document.getElementById('g').getContext('2d'),ov=document.getElementById('ov'),hud=document.getElementById('hud');
cx.imageSmoothingEnabled=false;
let S,C=null,best=0;try{best=+localStorage.getItem('adbest')||0}catch(e){}
const CH=[
{n:'Cavaliere',hp:6,d:'6 cuori + scudo: para il primo errore di ogni piano'},
{n:'Maga',hp:4,d:'4 pergamene 50/50 per eliminare risposte sbagliate'},
{n:'Esploratrice',hp:5,d:'Vista lunga nel buio e tesori che valgono doppio'},
{n:'Guaritore',hp:5,d:'Recupera 1 cuore ogni 3 risposte esatte'}];
const RL=[
{n:'Cuore di cristallo',d:'+2 cuori massimi e guarisci 2',f:()=>{S.max+=2;S.hp=Math.min(S.max,S.hp+2)}},
{n:'Pergamena 50/50',d:'+3 usi: elimina 2 risposte sbagliate',f:()=>S.fifty+=3},
{n:'Scudo di ferro',d:'Ogni piano blocca il primo errore',f:()=>S.shield=true},
{n:'Pozione rossa',d:'Guarisci completamente',f:()=>S.hp=S.max}];
const H_=()=>{if(S)hud.innerHTML=`<span><b>${'♥'.repeat(S.hp)}</b><i>${'♥'.repeat(Math.max(0,S.max-S.hp))}</i>${S.sh?' 🛡':''}</span><span>Piano ${S.floor}/5 · ${FN[S.floor]}</span><span>Punti ${S.score}</span><span>50/50: ${S.fifty}</span>`};
function look(){for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(Math.abs(x-S.p.x)+Math.abs(y-S.p.y)<=S.vis)S.seen[y][x]=1}
function gen(){
 const m=Array.from({length:GH},()=>Array(GW).fill(1)),rooms=[];
 for(let t=0;t<80&&rooms.length<6;t++){const w=3+r(4),h=3+r(3),x=1+r(GW-w-1),y=1+r(GH-h-1);
  if(rooms.some(o=>x<o.x+o.w+1&&x+w+1>o.x&&y<o.y+o.h+1&&y+h+1>o.y))continue;rooms.push({x,y,w,h})}
 rooms.forEach(o=>{for(let j=o.y;j<o.y+o.h;j++)for(let i=o.x;i<o.x+o.w;i++)m[j][i]=0});
 const ctr=o=>[o.x+(o.w>>1),o.y+(o.h>>1)];
 for(let k=1;k<rooms.length;k++){const[a,b]=ctr(rooms[k-1]),[d,e]=ctr(rooms[k]);
  for(let i=Math.min(a,d);i<=Math.max(a,d);i++)m[b][i]=0;
  for(let j=Math.min(b,e);j<=Math.max(b,e);j++)m[j][d]=0}
 const[px,py]=ctr(rooms[0]),[sx,sy]=ctr(rooms[rooms.length-1]),fl=[];
 for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(!m[y][x]&&Math.abs(x-px)+Math.abs(y-py)>4&&!(x==sx&&y==sy))fl.push([x,y]);
 shuf(fl);
 S.en=fl.splice(0,3+S.floor).map(([x,y])=>({x,y,px:x,py:y,ph:r(6),t:pick(['sl','sl','sk','bt'])}));
 if(S.floor==5)S.en.push({x:sx,y:sy,px:sx,py:sy,ph:0,t:'bo'});
 S.ch=fl.splice(0,2).map(([x,y])=>({x,y,k:r(2)?'h':'g'}));
 S.st=S.floor<5?{x:sx,y:sy}:null;S.m=m;S.p={x:px,y:py,px,py,f:1};S.sh=S.shield;S.seen=m.map(row=>row.map(()=>0));
 S.th=S.floor<=2?1:S.floor<=4?2:3;S.seed=r(1e6);S.pt=[];S.amb=[];S.ft=[];renderMap();setDrone(S.floor);look()}
function enemies(){for(const e of S.en){const dx=S.p.x-e.x,dy=S.p.y-e.y,d=Math.abs(dx)+Math.abs(dy);
 const act=e.t=='bt'?d<=6&&r(3):e.t=='sk'?d<=4:e.t=='bo'?d<=6&&r(2):0;if(!act)continue;
 const o=Math.abs(dx)>=Math.abs(dy)?[[Math.sign(dx),0],[0,Math.sign(dy)]]:[[0,Math.sign(dy)],[Math.sign(dx),0]];
 for(const[ax,ay]of o){if(!ax&&!ay)continue;const nx=e.x+ax,ny=e.y+ay;
  if(nx==S.p.x&&ny==S.p.y){fight(e);return}
  if(!S.m[ny][nx]&&!S.en.some(q=>q.x==nx&&q.y==ny)){e.x=nx;e.y=ny;break}}}}
function mv(dx,dy){if(C||!S||ov.style.display=='flex')return;
 if(dx)S.p.f=dx;
 const nx=S.p.x+dx,ny=S.p.y+dy;if(S.m[ny][nx])return;
 const e=S.en.find(q=>q.x==nx&&q.y==ny);if(e){fight(e);return}
 S.p.x=nx;S.p.y=ny;look();SFX.step();
 const i=S.ch.findIndex(q=>q.x==nx&&q.y==ny);
 if(i>=0){const q=S.ch.splice(i,1)[0];if(q.k=='h'){S.hp=Math.min(S.max,S.hp+1);SFX.heart();fx(nx,ny,'+1 ♥','#d0302a');boom(nx,ny,['#9a2222','#e04a2a'],10,1.5)}
  else{const g=S.cls==2?50:25;S.score+=g;SFX.coin();fx(nx,ny,'+'+g,'#d8a040');boom(nx,ny,['#d8a040','#ffd27a'],12,1.8)}}
 if(S.st&&S.st.x==nx&&S.st.y==ny){S.score+=50;SFX.stairs();relics();return}
 enemies();H_()}
function relics(){H_();const o=shuf([...RL]).slice(0,3);ov.style.display='flex';
 ov.innerHTML=`<div class=box><h1>Piano ${S.floor} superato</h1><p>Scendi più a fondo. Scegli un cimelio:</p>${o.map(x=>`<p><button data-r=${RL.indexOf(x)} style="width:100%">${x.n}<br><small>${x.d}</small></button></p>`).join('')}</div>`}
function fight(e){C={e,hp:e.t=='bo'?3:1,msg:''};SFX.appear();nq()}
function nq(){let q;do q=pick(G[C.e.t=='bo'?4+r(2):Math.max(1,Math.min(5,S.floor+r(3)-1))])();while(!q.a.length);
 const o=[str(q.a)];for(let g=0;o.length<4&&g<80;g++){const s=str(mut(q.a));if(!o.includes(s))o.push(s)}
 for(let k=1;o.length<4;k++){const s=str(add(q.a,[T(k,1,0)]));if(!o.includes(s))o.push(s)}
 C.q=q;C.ans=o[0];C.o=shuf(o);C.hid=[];C.done=0;C.hint=0;ren()}
function ren(){const e=C.e;ov.style.display='flex';
 ov.innerHTML=`<div class="box ${C.fx||''}"><canvas id=ec width=24 height=24></canvas>
 <div class=nm>${NM[e.t]} <span style="color:#d0302a">${'♥'.repeat(C.hp)}</span></div>
 <div class=q>${C.q.t}</div>
 <div class=opts>${C.o.map((s,i)=>`<button data-i=${i} class="${C.done&&s==C.ans?'ok':C.done&&i==C.ch?'ko':''}" ${C.hid.includes(i)||C.done?'disabled':''}>${i+1}) ${s}</button>`).join('')}</div>
 <div class=row>${C.done?'<button data-a=next>Continua ▶</button>':`<button data-a=hint>💡 Aiuto</button><button data-a=fifty ${S.fifty?'':'disabled'}>✂ 50/50 (${S.fifty})</button>`}</div>
 <div class=fb>${C.done?C.msg+'<br>Risposta corretta: <b>'+C.ans+'</b><br>'+C.q.h:C.hint?C.q.h:C.msg}</div></div>`;
 portrait(ov.querySelector('#ec'),e.t,performance.now());C.fx='';H_()}
function ans(i){if(!C||C.done||C.hid.includes(i))return;
 if(C.o[i]==C.ans){SFX.ok();hurt(C.e);S.score+=5*S.floor;C.hp--;S.ok++;S.cc++;if(S.cls==3&&S.cc%3==0&&S.hp<S.max){S.hp++;fx(S.p.x,S.p.y,'+1 ♥','#d0302a')}
  if(C.hp<=0){boom(C.e.x,C.e.y,GORE[C.e.t],30,2.6);SFX.kill();S.en=S.en.filter(q=>q!==C.e);const b=C.e.t=='bo';S.score+=b?200:10*S.floor;C=null;if(b)end(1);else{ov.style.display='none';H_()}}
  else{C.msg='Colpito! Ne servono ancora '+C.hp+'.';C.fx='hit';nq()}}
 else{S.ko++;SFX.bad();S.shk=9;fx(S.p.x,S.p.y,'−1 ♥','#d0302a');C.fx='shake';if(S.sh){S.sh=false;C.msg='🛡 Lo scudo para il colpo!'}else{S.hp--;C.msg='−1 ♥'}C.done=1;C.ch=i;ren()}}
function nxt(){if(!C||!C.done)return;C.msg='';if(S.hp<=0){C=null;end(0)}else nq()}
function fifty(){if(!C||!S.fifty||C.done)return;const w=shuf(C.o.map((s,i)=>i).filter(i=>C.o[i]!=C.ans&&!C.hid.includes(i)));C.hid.push(w[0],w[1]);S.fifty--;ren()}
function grade(win){const n=S.ok+S.ko;let v=n?10*S.ok/n:0;if(!win)v*=Math.min(1,.4+.12*S.floor);return Math.max(1,Math.min(10,Math.round(v*2)/2))}
const LBL=v=>v>=9?'Ottimo':v>=8?'Distinto':v>=7?'Buono':v>=6?'Sufficiente':v>=5?'Mediocre':'Insufficiente';
function gr(w){const n=S.ok+S.ko,v=grade(w);return `<div style='border:3px solid #6b5440;outline:2px solid #0b0908;background:#1e1714;padding:12px;margin:12px 0'><div>${S.nm} · ${CH[S.cls].n}</div><div class=num style='font-size:76px;color:${v>=6?'#9ac060':'#d0302a'};text-shadow:3px 3px 0 #000'>${v}/10</div><div>${LBL(v)} · Risposte esatte: ${S.ok} su ${n} (${n?Math.round(100*S.ok/n):0}%)</div><small>${w?'Missione completata':'Voto parziale: sei arrivato al piano '+S.floor+' di 5'}</small></div>`}
function end(w){C=null;w?SFX.win():SFX.lose();best=Math.max(best,S.score);try{localStorage.setItem('adbest',best)}catch(e){}
 ov.style.display='flex';ov.innerHTML=`<div class=box><h1>${w?'VITTORIA':'SEI CADUTO'}</h1><p>${w?'Il Re dei Polinomi è stato sconfitto.':'Il dungeon ti ha inghiottito al piano '+S.floor+'.'}</p><p>Punti: <b class=num>${S.score}</b> · Record: <span class=num>${best}</span></p>${gr(w)}<button data-a=go>Gioca ancora</button></div>`;H_()}
function pickHero(){ov.style.display='flex';ov.innerHTML=`<div class=box style='max-width:760px'><h1>Scegli il tuo eroe</h1><p><input id=nm placeholder='Il tuo nome' maxlength=20></p><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px'>${CH.map((c,i)=>`<button data-c=${i}><canvas id=pc${i} class=hc width=20 height=20></canvas>${c.n}<br><small>${c.d}</small></button>`).join('')}</div></div>`}
function start(i){const c=CH[i];S={floor:1,hp:c.hp,max:c.hp,score:0,fifty:i==1?4:1,shield:i==0,sh:false,ft:[],pt:[],amb:[],shk:0,vis:i==2?8:5,cls:i,ok:0,ko:0,cc:0,nm:(document.getElementById('nm')||{}).value||'Eroe'};AU();startDrone();music();gen();ov.style.display='none';H_()}
ov.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.i!=null)ans(+d.i);else if(d.a=='hint'){C.hint=1;ren()}else if(d.a=='fifty')fifty();else if(d.a=='next')nxt();else if(d.a=='go')pickHero();else if(d.c!=null)start(+d.c);
 else if(d.r!=null){RL[+d.r].f();SFX.coin();S.floor++;gen();ov.style.display='none';H_()}};
document.getElementById('pad').onclick=e=>{const b=e.target.closest('button');if(b)mv(...b.dataset.d.split(',').map(Number))};
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;const k=e.key.length==1?e.key.toLowerCase():e.key,cd={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',KeyH:'h',KeyF:'f'}[e.code];
 if(C){if(k>='1'&&k<='4')ans(k-1);else if(k=='Enter')nxt();else if((k=='h'||cd=='h')&&!C.done){C.hint=1;ren()}else if(k=='f'||cd=='f')fifty();return}
 const M={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]},d=M[k]||M[cd];
 if(d){e.preventDefault();mv(...d)}});
document.getElementById('mt').onclick=e=>{muted^=1;if(mg)mg.gain.value=muted?0:.9;e.target.textContent=muted?'🔇':'🔊'};
buildSprites();
function digitize(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;
 while(n=w.nextNode()){const p=n.parentElement;if(/\d/.test(n.nodeValue)&&p&&!p.closest('.d,.q,.opts,.num,input'))L.push(n)}
 L.forEach(n=>{const f=document.createElement('span');f.innerHTML=n.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/(\d+(?:\/\d+)?)/g,'<span class=d>$1</span>');n.replaceWith(...f.childNodes)})}
new MutationObserver(()=>digitize(ov)).observe(ov,{childList:true,subtree:true});
ov.style.display='flex';
ov.innerHTML=`<div class=box><h1>ALGEBRA DUNGEON</h1><canvas id=tc width=64 height=24></canvas>
<p>Scendi nelle cripte e affronta i mostri: sopravvive solo chi sa calcolare con <b>monomi e polinomi</b>.</p>
<p><small>Risposta sbagliata = perdi un cuore. Scendi 5 piani, scegli un cimelio dopo ogni piano e sconfiggi il Re dei Polinomi. Alla fine ricevi un voto in decimi.</small></p>
<p>Record: ${best}</p><button data-a=go>▶ INIZIA</button></div>`;
(function L(){requestAnimationFrame(L);const t=performance.now();if(S&&S.mc)draw();
 const ec=document.getElementById('ec');if(ec&&C)portrait(ec,C.e.t,t);
 for(let i=0;i<4;i++){const c=document.getElementById('pc'+i);if(c)portrait(c,'p'+i,t)}
 const tc=document.getElementById('tc');if(tc)title(tc,t)})();
</script></body></html>
